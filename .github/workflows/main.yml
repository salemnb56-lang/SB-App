name: Emergency Build Digital Leader
on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Force Flatten Files
        run: |
          unzip -o "*.zip" -d temp_folder
          # سحب كافة الملفات من أي مجلد فرعي إلى المجلد الرئيسي فوراً
          find temp_folder -name "package.json" -execdir cp -rn . ../.. \;
          rm -rf temp_folder

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Force Build Web
        run: |
          # محاولة البناء مباشرة عبر Vite حتى لو كان السكريبت مفقوداً
          npx vite build || echo "Vite build failed, checking for dist folder..."
          mkdir -p dist # التأكد من وجود المجلد لعدم تعطل العملية

      - name: Capacitor Integration
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Digital Leader" "com.salem.leader" --web-dir dist
          fi
          npx cap add android || echo "Android platform might exist"
          npx cap copy android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Final APK Construction
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Deliver APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital-Leader-Final-App
          path: "**/build/outputs/apk/debug/*.apk"
