name: Build Digital Leader APK
on: [push]

# إجبار المحرك على استخدام Node 24 لمنع التنبيهات
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Extract & Find Project
        run: |
          unzip -o "*.zip" -d .
          # البحث التلقائي عن المجلد الذي يحتوي على ملف البرمجة
          PACKAGE_PATH=$(find . -name "package.json" | head -n 1)
          if [ -z "$PACKAGE_PATH" ]; then
            echo "خطأ: لم نجد ملف package.json! تأكد من رفع ملف الـ ZIP الصحيح."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PACKAGE_PATH")
          echo "تم العثور على المشروع في: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install & Build Web Project
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm install
          npm run build --if-present

      - name: Setup Android Wrapper (Capacitor)
        run: |
          cd ${{ env.PROJECT_DIR }}
          # تثبيت أدوات تحويل الموقع إلى تطبيق
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # إنشاء إعدادات التطبيق إذا لم تكن موجودة
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Digital Leader" "com.salem.leader" --web-dir dist
          fi
          
          npx cap add android
          npx cap copy android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Final APK
        run: |
          # البحث عن مجلد أندرويد والدخول إليه لبدء البناء
          ANDROID_DIR=$(find . -name "gradlew" | head -n 1)
          cd $(dirname "$ANDROID_DIR")
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital-Leader-V1
          path: "**/build/outputs/apk/debug/*.apk"
