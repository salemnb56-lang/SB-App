name: Qaaed Digital Builder - Auto Fix
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extraction and File Move
        run: |
          unzip -o "digital-leader-app..zip"
          if [ -d "digital-leader-app" ]; then
            cp -rn digital-leader-app/* . || true
            cp -rn digital-leader-app/.* . 2>/dev/null || true
          fi

      - name: Fix Missing Styles
        run: |
          # هذا السطر يبحث عن ملف التنسيقات ويضيف النمط المفقود تلقائياً
          FILE=$(find app/src/main/res/values -name "themes.xml" -o -name "styles.xml" | head -n 1)
          if [ -f "$FILE" ]; then
            sed -i '/<\/resources>/i \    <style name="TextStyle"><item name="android:textSize">16sp</item><item name="android:textColor">#000000</item></style>' $FILE
            echo "Successfully injected TextStyle into $FILE"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Prepare Execution Files
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.9
            chmod +x gradlew
          fi

      - name: Build Android APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Export Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Qaaed-Leader-App
          path: "**/build/outputs/apk/debug/*.apk"
