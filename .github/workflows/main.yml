name: Kotlin App Chef
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Ingredients (Unzip)
        run: |
          # فك ضغط ملف المشروع
          unzip -o "*.zip" -d project_files || true
          
          # البحث عن ملف "gradlew" وهو مفتاح التشغيل
          GRADLE_PATH=$(find project_files -name "gradlew" -printf '%h' -quit)
          
          if [ -z "$GRADLE_PATH" ]; then
            echo "خطأ: لم نجد ملفات الأندرويد الأساسية. تأكد أن ملف الـ ZIP يحتوي على مشروع أندرويد."
            exit 1
          fi
          
          # نقل الملفات للمكان الصحيح للبدء في الطبخ
          cp -rn "$GRADLE_PATH"/* . || true
          cp -rn "$GRADLE_PATH"/.* . 2>/dev/null || true

      - name: Setup Kitchen (Java 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Permission
        run: chmod +x gradlew

      - name: Cook the APK (Build)
        run: ./gradlew assembleDebug

      - name: Deliver the App
        uses: actions/upload-artifact@v4
        with:
          name: My-Kotlin-App
          path: "**/build/outputs/apk/debug/*.apk"
