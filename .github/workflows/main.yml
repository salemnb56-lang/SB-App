name: Qaaed Digital Builder
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extraction and File Move
        run: |
          # فك ضغط الملف بالاسم الذي حددته
          unzip -o "digital-leader-app..zip"
          
          # نقل الملفات من المجلد الداخلي (digital-leader-app) للمجلد الرئيسي
          if [ -d "digital-leader-app" ]; then
            echo "Moving files from internal folder..."
            cp -rn digital-leader-app/* . || true
            cp -rn digital-leader-app/.* . 2>/dev/null || true
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Prepare Execution Files
        run: |
          # هذا هو بديل السطر 41 (طريقة كتابة آمنة لا تسبب خطأ YAML)
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.9
            chmod +x gradlew
          fi

      - name: Build Android APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Export Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Qaaed-Leader-App
          path: "**/build/outputs/apk/debug/*.apk"
