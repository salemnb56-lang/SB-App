name: Modern Kotlin Builder - Final Fix
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extraction and Setup
        run: |
          # فك الضغط بأكثر من طريقة لضمان النجاح
          unzip -o "qaaed-android.zip" -d output_dir || unzip -o "*.zip" -d output_dir || true
          
          # البحث عن المجلد الذي يحتوي على ملف settings.gradle.kts (قلب المشروع)
          # ونقل محتوياته للمجلد الرئيسي
          REAL_PATH=$(find output_dir -name "settings.gradle.kts" -printf '%h' -quit)
          if [ -n "$REAL_PATH" ]; then
            echo "Found project at $REAL_PATH. Moving files..."
            cp -rn "$REAL_PATH"/* . || true
            cp -rn "$REAL_PATH"/.* . 2>/dev/null || true
          else
            echo "Error: Could not find settings.gradle.kts inside ZIP"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # قمنا بإزالة سطر الـ cache هنا لأنه هو من تسبب في الخطأ الأخير

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Grant Execute Permission
        run: [ -f gradlew ] && chmod +x gradlew || (gradle wrapper && chmod +x gradlew)

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Qaaed-App-Ready
          path: "**/build/outputs/apk/debug/*.apk"
