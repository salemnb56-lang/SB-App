name: Final Direct Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o "*.zip" -d temp_folder || true
          # البحث عن مكان package.json ونقل الملفات للمجلد الرئيسي
          REAL_PATH=$(find temp_folder -name "package.json" -printf '%h' -quit)
          cp -rn "$REAL_PATH"/* . || true
          cp -rn "$REAL_PATH"/.* . 2>/dev/null || true
          rm -rf temp_folder

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          # إعداد pnpm ليتجاهل تدقيق التبعات الصارم (بديل legacy-peer-deps)
          pnpm config set strict-peer-dependencies false
          # تثبيت المكتبات مع تجاهل ملف lock المفقود
          pnpm install --no-frozen-lockfile

      - name: Build Assets
        run: pnpm run build --if-present

      - name: Capacitor Android
        run: |
          pnpm add @capacitor/core @capacitor/cli @capacitor/android
          # تحديد مجلد المخرجات تلقائياً
          WEB_DIR=$(if [ -d "dist" ]; then echo "dist"; elif [ -d "build" ]; then echo "build"; else echo "."; fi)
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "DigitalLeader" "com.salem.leader" --web-dir $WEB_DIR
          fi
          npx cap add android || true
          npx cap copy android

      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Export APK
        uses: actions/upload-artifact@v4
        with:
          name: Final-App-Package
          path: "**/build/outputs/apk/debug/*.apk"
