name: Production Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and Flatten
        run: |
          unzip -o "*.zip" -d temp_folder || true
          # البحث عن المجلد الذي يحتوي على package.json
          REAL_PATH=$(find temp_folder -name "package.json" -printf '%h' -quit)
          if [ -z "$REAL_PATH" ]; then exit 1; fi
          # نقل الملفات للمجلد الرئيسي لضمان عدم وجود مسارات مفقودة
          cp -rn "$REAL_PATH"/* . || true
          cp -rn "$REAL_PATH"/.* . 2>/dev/null || true
          rm -rf temp_folder

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install Dependencies
        run: |
          # إعداد pnpm ليتوافق مع مكتباتك دون تدقيق صارم
          pnpm config set strict-peer-dependencies false
          # التثبيت مع تجاهل ملف lock المفقود أو المتعارض
          pnpm install --no-frozen-lockfile

      - name: Build Web
        run: pnpm run build --if-present

      - name: Capacitor Setup
        run: |
          pnpm add @capacitor/core @capacitor/cli @capacitor/android
          # التأكد من وجود مجلد المخرجات (dist أو build)
          WEB_DIR=$(if [ -d "dist" ]; then echo "dist"; elif [ -d "build" ]; then echo "build"; else mkdir -p dist && echo "dist"; fi)
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "DigitalLeader" "com.salem.leader" --web-dir $WEB_DIR
          fi
          npx cap add android || true
          npx cap copy android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital-Leader-Final
          path: "**/build/outputs/apk/debug/*.apk"
