name: Nuclear Build Fix
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hard Reset Project
        run: |
          unzip -o "*.zip" -d temp || true
          REAL_PATH=$(find temp -name "package.json" -printf '%h' -quit)
          cp -rn "$REAL_PATH"/* . || true
          # حذف كل ما له علاقة بـ pnpm والكتالوجات التي تسبب الأخطاء
          rm -f pnpm-lock.yaml pnpm-workspace.yaml
          # استبدال كلمة "catalog:default" بأحدث النسخ لكي يفهمها npm العادي
          sed -i 's/catalog:default/latest/g' package.json
          rm -rf temp

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Force Install (Standard NPM)
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: Build Web
        run: npm run build --if-present || npx vite build

      - name: Android Conversion
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          WEB_DIR=$(if [ -d "dist" ]; then echo "dist"; elif [ -d "build" ]; then echo "build"; else mkdir -p dist && echo "dist"; fi)
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "App" "com.salem.app" --web-dir $WEB_DIR
          fi
          npx cap add android || true
          npx cap copy android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Final APK
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleDebug

      - name: Download Link
        uses: actions/upload-artifact@v4
        with:
          name: Working-APK
          path: "**/build/outputs/apk/debug/*.apk"
