name: Final Rescue Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files First
        run: |
          # فك الضغط فوراً قبل أي خطوة أخرى
          unzip -o "*.zip" -d temp_folder || true
          # البحث عن مكان ملف package.json الحقيقي ونقله للمكان الرئيسي
          REAL_PATH=$(find temp_folder -name "package.json" -printf '%h' -quit)
          if [ -z "$REAL_PATH" ]; then
            echo "Error: No project files found in ZIP"
            exit 1
          fi
          cp -rn "$REAL_PATH"/* . || true
          cp -rn "$REAL_PATH"/.* . 2>/dev/null || true
          rm -rf temp_folder search_area

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # أزلنا خاصية الـ cache لأنها هي من تسببت في الخطأ الأخير

      - name: Force Install Dependencies
        run: |
          # تجاهل ملفات الـ lock القديمة وتثبيت المكونات من جديد
          pnpm install --no-frozen-lockfile --legacy-peer-deps

      - name: Build Web Assets
        run: |
          pnpm run build --if-present || npx vite build || echo "Skipping build step"

      - name: Setup Capacitor & Android
        run: |
          pnpm add @capacitor/core @capacitor/cli @capacitor/android
          # التأكد من وجود مجلد الويب للتحويل
          WEB_DIR=$(if [ -d "dist" ]; then echo "dist"; elif [ -d "build" ]; then echo "build"; else echo "."; fi)
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "App" "com.app.final" --web-dir $WEB_DIR
          fi
          npx cap add android || true
          npx cap copy android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Final APK Generation
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Android folder missing"
            exit 1
          fi

      - name: Deliver APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Final-Package
          path: "**/build/outputs/apk/debug/*.apk"
