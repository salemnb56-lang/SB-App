name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          # فك ضغط الملف الذي رفعته
          unzip -o "qaaed-android.zip" -d temp_folder || true
          
          # نقل الملفات من المجلد الفرعي إلى المجلد الرئيسي لكي يراها جرادل
          # الصورة التي أرسلتها سابقاً أظهرت أن المسار هو temp_folder/qaaed-android
          cp -rn temp_folder/qaaed-android/* . || true
          cp -rn temp_folder/qaaed-android/.* . 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qaaed-digital-app
          path: "**/build/outputs/apk/debug/*.apk"
