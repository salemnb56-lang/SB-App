name: Build Android APK (Kotlin Success Blueprint)
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP File
        run: |
          # فك ضغط ملف المشروع أياً كان اسمه
          unzip -o "*.zip" -d project_files
          
          # البحث التلقائي عن المجلد الذي يحتوي على ملف البناء (gradlew)
          # هذه الخطوة هي "سر النجاح" لأنها تتجاوز مشكلة المجلدات المتداخلة
          PROJECT_ROOT=$(find project_files -name "gradlew" -printf '%h' -quit)
          
          if [ -z "$PROJECT_ROOT" ]; then
            echo "Error: Could not find gradlew file in the ZIP."
            exit 1
          fi
          
          echo "Found project at: $PROJECT_ROOT"
          # نقل كل ملفات المشروع للمجلد الرئيسي ليتمكن النظام من رؤيتها
          cp -rn "$PROJECT_ROOT"/* . || true
          cp -rn "$PROJECT_ROOT"/.* . 2>/dev/null || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (The Cooking Process)
        run: ./gradlew assembleDebug

      - name: Upload APK (Deliver the Order)
        uses: actions/upload-artifact@v4
        with:
          name: My-App-Package
          path: app/build/outputs/apk/debug/*.apk
