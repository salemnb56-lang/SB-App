name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Smart Project Locator
        run: |
          unzip -o "*.zip" -d search_area || true
          REAL_PATH=$(find search_area -name "package.json" -printf '%h' -quit)
          if [ -z "$REAL_PATH" ]; then exit 1; fi
          cp -rn "$REAL_PATH"/* . || true
          cp -rn "$REAL_PATH"/.* . 2>/dev/null || true
          rm -rf search_area

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Assets
        run: pnpm run build --if-present

      - name: Setup Capacitor & Android
        run: |
          pnpm add @capacitor/core @capacitor/cli @capacitor/android
          WEB_DIR=$(if [ -d "dist" ]; then echo "dist"; elif [ -d "build" ]; then echo "build"; else echo "."; fi)
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Digital Leader" "com.salem.leader" --web-dir $WEB_DIR
          fi
          npx cap add android || true
          npx cap copy android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Final APK Generation
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Deliver APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileApp-Final
          path: "**/build/outputs/apk/debug/*.apk"
