name: Ultimate Digital Leader Builder
on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Extract & Move Files to Root
        run: |
          unzip -o "*.zip" -d temp_folder
          # البحث عن مكان وجود ملف package.json الحقيقي ونقل كل محتوياته للمجلد الرئيسي
          REAL_PATH=$(find temp_folder -name "package.json" | head -n 1)
          PROJECT_ROOT=$(dirname "$REAL_PATH")
          cp -r "$PROJECT_ROOT"/. .
          rm -rf temp_folder

      - name: Install Dependencies
        run: |
          # استخدام --legacy-peer-deps لتفادي مشاكل التوافق في المشاريع القديمة
          npm install --legacy-peer-deps

      - name: Build Web Project
        run: npm run build --if-present

      - name: Setup Capacitor (Android Wrapper)
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # التأكد من وجود مجلد البناء (dist) قبل إضافة الأندرويد
          mkdir -p dist
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Digital Leader" "com.salem.leader" --web-dir dist
          fi
          npx cap add android
          npx cap copy android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital-Leader-Final
          path: "**/build/outputs/apk/debug/*.apk"
