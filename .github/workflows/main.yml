name: Modern Kotlin Builder
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # النسخة الأحدث

      - name: Unzip and Move Files
        run: |
          # فك ضغط الملف
          unzip -o "qaaed-android.zip" -d temp_folder || true
          
          # نقل الملفات للمجلد الرئيسي لكي يراها Gradle
          # نحن نعلم أن الملفات داخل مجلد qaaed-android
          if [ -d "temp_folder/qaaed-android" ]; then
            cp -rn temp_folder/qaaed-android/* . || true
            cp -rn temp_folder/qaaed-android/.* . 2>/dev/null || true
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4 # النسخة الأحدث
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Final APK
        uses: actions/upload-artifact@v4 # هذا هو الإصلاح المطلوب لخطأ v3
        with:
          name: Qaaed-Official-App
          path: "app/build/outputs/apk/debug/*.apk"
