name: Build Web to APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Web
        run: |
          unzip -o "*.zip" -d .
          # الدخول لمجلد المشروع إذا كان مضغوطاً بداخل مجلد
          cd Digital-Leader || cd .
          npm install
          npm run build

      - name: Setup Capacitor (The Wrapper)
        run: |
          cd Digital-Leader || cd .
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Digital Leader" "com.salem.leader" --web-dir dist
          npx cap add android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Final APK
        run: |
          cd Digital-Leader/android || cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital-Leader-App
          path: "**/build/outputs/apk/debug/*.apk"
